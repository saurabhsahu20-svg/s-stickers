name: StickU 2.7.0 Release Build
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release containing the full source ZIP'
        required: true
        default: 'StickU'
        type: string
permissions:
  contents: write
concurrency:
  group: s-stickers-v270-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v2.7.0' || github.event.release.tag_name == 'StickU'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      SOURCE_ZIP: StickU-v2.7.0-Social-WhatsApp-Source.zip
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify exact full source
        run: |
          gh release download "$RELEASE_TAG" --pattern "$SOURCE_ZIP" --dir "$RUNNER_TEMP"
          echo "cda6a5afd3ecb29b7424f45ffe50199ca29687ebbf552a6d5f5c782e1f7754e7  $RUNNER_TEMP/$SOURCE_ZIP" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/$SOURCE_ZIP"
          mkdir -p "$RUNNER_TEMP/full-source"
          unzip -q "$RUNNER_TEMP/$SOURCE_ZIP" -d "$RUNNER_TEMP/full-source"
          test -f "$RUNNER_TEMP/full-source/app/build.gradle"
          test "$(find "$RUNNER_TEMP/full-source/app/src/main/assets/wa" -maxdepth 1 -name '*.webp' | wc -l)" -eq 1843
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure hosted Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$manager"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            set +o pipefail
            yes | "$manager" --sdk_root="$SDK" --licenses >/dev/null
            set -o pipefail
            "$manager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply StickU display name without changing package
        working-directory: ${{ runner.temp }}/full-source
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          a = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools', 'http://schemas.android.com/tools')
          p = Path('app/src/main/AndroidManifest.xml')
          tree = ET.parse(p)
          app = tree.getroot().find('application')
          assert app is not None
          app.set(a+'label', 'StickU')
          for activity in list(app.findall('activity')) + list(app.findall('activity-alias')):
              for f in activity.findall('intent-filter'):
                  if any(c.get(a+'name') == 'android.intent.category.LAUNCHER' for c in f.findall('category')):
                      activity.set(a+'label', 'StickU')
          tree.write(p, encoding='utf-8', xml_declaration=True)
          for p in Path('app/src/main/res').glob('values*/strings.xml'):
              tree = ET.parse(p)
              changed = False
              for s in tree.getroot().findall('string'):
                  if s.get('name') == 'app_name':
                      s.text = 'StickU'
                      changed = True
              if changed:
                  tree.write(p, encoding='utf-8', xml_declaration=True)
          PY
      - name: Validate full collection and build
        working-directory: ${{ runner.temp }}/full-source
        env:
          SIGNING_KEY: ${{ secrets.S_STICKERS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.S_STICKERS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.S_STICKERS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.S_STICKERS_KEY_PASSWORD }}
        run: |
          python tools/restore_pngs.py
          python tools/validate_assets.py
          mkdir -p "$RUNNER_TEMP/dist"
          if [ -n "$SIGNING_KEY" ]; then
            test -n "$KS_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
            umask 077
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.p12"
            trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
            gradle --no-daemon --stacktrace :app:assembleRelease
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            APK="$RUNNER_TEMP/dist/StickU-v2.7.0.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$APK" "$RUNNER_TEMP/aligned.apk"
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
            APK="$RUNNER_TEMP/dist/StickU-v2.7.0-test.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK"
            echo "::warning::No existing signing key configured. Test APK requires a fresh install if certificates differ."
          fi
          python tools/validate_assets.py "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/dist/APK-info.txt"
          grep -q "^package: name='com.sstickers.app'" "$RUNNER_TEMP/dist/APK-info.txt"
          grep -q "^application-label:'StickU'" "$RUNNER_TEMP/dist/APK-info.txt"
          cd "$RUNNER_TEMP/dist"
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StickU-v2.7.0-1843-stickers
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
      - name: Publish verified APK to GitHub release
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/dist/*.apk "$RUNNER_TEMP/dist/SHA256SUMS.txt" --clobber
