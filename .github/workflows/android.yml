name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$manager"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            set +o pipefail
            yes | "$manager" --sdk_root="$SDK" --licenses > /dev/null
            set -o pipefail
            "$manager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sticker rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          python -m pip install Pillow==11.4.0
          python -c "from PIL import features; assert features.check_feature('raqm')"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate packaged sticker assets and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          python - "$APK" <<'PY'
          import sys, json, zipfile
          from PIL import Image
          from io import BytesIO
          with zipfile.ZipFile(sys.argv[1]) as z:
              rows=json.loads(z.read("assets/catalog.json"))
              names=[n for n in z.namelist() if n.startswith("assets/stickers/") and n.endswith(".png")]
              assert len(rows)==len(names)==1420
              assert len({r["id"] for r in rows})==1420
              for row in rows:
                  with Image.open(BytesIO(z.read("assets/stickers/"+row["id"]+".png"))) as image:
                      assert image.size==(512,512) and image.mode=="RGBA"
                      image.verify()
              print("Validated all 1420 packaged sticker images")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          mkdir -p dist
          cp "$APK" dist/S-Stickers-v1.4.0-debug.apk
          cd dist
          sha256sum S-Stickers-v1.4.0-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: S-Stickers-v1.4.0-debug
          path: dist/
          if-no-files-found: error
