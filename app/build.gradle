plugins { id 'com.android.application' }
android {
    namespace 'com.sstickers.app'
    compileSdk 35
    defaultConfig { applicationId 'com.sstickers.app'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1.0' }
    sourceSets { main { assets.srcDir "$buildDir/generated/stickerAssets" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('generateStickers', Exec) {
    inputs.files rootProject.file('tools/generate.py'), rootProject.file('tools/generate_desi.py'), rootProject.file('tools/desi_phrases.json')
    outputs.dir layout.buildDirectory.dir('generated/stickerAssets')
    commandLine 'python3', rootProject.file('tools/generate_desi.py').absolutePath, layout.buildDirectory.dir('generated/stickerAssets').get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'generateStickers' }
